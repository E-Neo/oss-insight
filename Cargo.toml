[package]
name = "oss-insight"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
oss-insight-source = { path = "crates/oss-insight-source" }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"

[workspace]
resolver = "2"
members = ["crates/oss-insight-http", "crates/oss-insight-source"]
