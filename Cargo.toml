[package]
name = "oss-insight"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
oss-insight-db = { path = "crates/oss-insight-db" }
oss-insight-source = { path = "crates/oss-insight-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
resolver = "2"
members = ["crates/oss-insight-http", "crates/oss-insight-source", "crates/oss-insight-db"]
